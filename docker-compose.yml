name: qualiscan
services:
  app:
    build: .
    container_name: qualiscan-app
    ports: ["${APP_PORT:-18219}:8000"]
    environment:
      - APP_PORT=${APP_PORT:-18219}
      - QUALISCAN_DATA_DIR=/app/data
      - QUALISCAN_SAMPLE_DIR=/app/sample_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - qualiscan-data:/app/data
volumes:
  qualiscan-data:
